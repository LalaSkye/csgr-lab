[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csgr-lab"
version = "0.1.0"
description = "Contracted Stability & Drift Measurement for LLMs. Deterministic scoring, auditable evidence, reproducible runs."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "LalaSkye"},
]
keywords = ["llm", "governance", "contracts", "drift", "scoring", "evidence", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "typer>=0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
csgr = "csgr_lab.cli:app"

[project.urls]
Homepage = "https://github.com/LalaSkye/csgr-lab"
Repository = "https://github.com/LalaSkye/csgr-lab"
Documentation = "https://github.com/LalaSkye/csgr-lab/tree/main/docs"
Issues = "https://github.com/LalaSkye/csgr-lab/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "csgr_lab"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["csgr_lab"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
